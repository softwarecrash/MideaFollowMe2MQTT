<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MideaFollowMe2MQTT</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"
              d="M10 20c12-10 32-10 44 0M16 30c9-7 23-7 32 0M23 40c5-4 13-4 18 0"/>
        <circle cx="32" cy="49" r="4" fill="currentColor"/>
      </svg>
      <div><h1>MideaFollowMe2MQTT</h1><h2>Air conditioner controller</h2></div>
    </div>

    <div class="panel">
      <div class="panel-title"><span>Device status</span><span id="online">Loading…</span></div>
      <div id="status" class="grid"></div>
    </div>

    <div class="panel">
      <div class="panel-title">Air conditioner controls</div>
      <div class="warning">
        Commands are sent by infrared. The air conditioner does not report its actual
        status back, so the displayed state may occasionally differ.
      </div>
      <div class="stack actions">
        <button onclick="command('/api/power-toggle')">Switch air conditioner on / off</button>
        <button class="btn-outline" onclick="command('/api/resend')">Send current settings again</button>
        <div class="grid">
          <label>Mode
            <select id="mode">
              <option value="cool">Cooling</option>
              <option value="heat">Heating</option>
              <option value="auto">Automatic</option>
              <option value="dry">Drying</option>
              <option value="fan_only">Fan only</option>
            </select>
          </label>
          <label>Desired temperature °C
            <input id="target" type="number" min="17" max="30" value="22">
          </label>
        </div>
        <button class="btn-outline"
                onclick="command('/api/climate?mode='+mode.value+'&target='+target.value)">
          Apply mode and temperature
        </button>
        <label>Current room temperature °C
          <input id="temp" type="number" min="0" max="37" value="23">
        </label>
        <button class="btn-outline" onclick="command('/api/follow?temperature='+temp.value)">
          Send room temperature now
        </button>
      </div>
    </div>

    <div class="panel">
      <a class="btn btn-outline" href="/settings">Settings</a>
    </div>
    <div class="footer">Firmware <span id="firmware">…</span> by SoftWareCrash</div>
  </div>

  <div class="toast" id="toast"></div>
  <script>
    const labels = {
      device: "Device", firmware: "Firmware", uptime_s: "Uptime (s)",
      free_heap: "Free heap", wifi_rssi_dbm: "Wi-Fi RSSI", ip: "IP address",
      mqtt_connected: "MQTT", last_ir_send_ms: "Last IR (ms)",
      last_follow_me_ms: "Last Follow-Me (ms)", room_temperature: "Room temperature",
      temperature_age_s: "Temperature age (s)", temperature_source: "Temperature source",
      local_sensor_detected: "Local DS18B20", local_temperature: "Local temperature",
      isense: "Room temperature control",
      power_mode: "Energy mode", wake_reason: "Wake reason", wake_count: "Wake count",
      awake_ms: "Awake (ms)", energy_saving_delay_s: "Power saving starts in (s)"
    };

    async function refresh() {
      try {
        const response = await fetch("/api/status", {cache: "no-store"});
        const data = await response.json();
        online.textContent = data.mqtt_connected ? "Online" : "Local";
        firmware.textContent = data.firmware;
        status.innerHTML = Object.entries(data)
          .filter(([, value]) => typeof value !== "object")
          .map(([key, value]) =>
            `<div class="metric"><small>${labels[key] || key}</small><span>${value === null ? "n/a" : value}</span></div>`)
          .join("");
      } catch {
        online.textContent = "Unavailable";
      }
    }

    function show(message, ok = true) {
      toast.textContent = message;
      toast.style.borderLeftColor = ok ? "var(--primary)" : "var(--danger)";
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3200);
    }

    async function command(url) {
      try {
        const response = await fetch(url, {method: "POST"});
        show(await response.text(), response.ok);
        refresh();
      } catch {
        show("Request failed", false);
      }
    }

    setInterval(refresh, 3000);
    refresh();
    setInterval(() => fetch("/api/activity", {cache: "no-store"}).catch(() => {}), 5000);
  </script>
</body>
</html>
