[platformio]
default_envs = d1_mini

[env]
custom_source_name = PortaSplit2MQTT
custom_source_version = 0.1.3
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DPIO_SRC_NAM=\"PortaSplit2MQTT\"
  -DPORTASPLIT_VERSION=\"0.1.3\"
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -DVTABLES_IN_FLASH
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.4.2
  crankyoldgit/IRremoteESP8266@^2.9.0
extra_scripts =
  pre:tools/embed_web.py
  tools/export_firmware.py

[env:d1_mini]
board = d1_mini
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, default, time, printable, colorize

[env:esp_ir_tr_v1_1]
board = esp8285
board_build.ldscript = eagle.flash.1m64.ld
board_build.flash_mode = dout
upload_speed = 115200
monitor_filters = esp8266_exception_decoder, default, time, printable, colorize
build_flags =
  ${env.build_flags}
  -DPORTASPLIT_BOARD_ESP_IR_TR=1
  -DPORTASPLIT_DEFAULT_IR_PIN=4

[env:native]
platform = native
framework =
test_framework = unity
build_src_filter = -<*> +<Climate/PortaSplitState.cpp>
build_flags = -std=gnu++17 -DUNIT_TEST
lib_deps =
  throwtheswitch/Unity@^2.6.1
